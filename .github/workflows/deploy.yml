name: Build, Test & Deploy

on:
  push:
    branches: [master]
  pull_request:
    branches: [master]

jobs:
  build-test-deploy:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Build site
        run: npm run build

      - name: Install Playwright browsers
        run: npx playwright install --with-deps chromium

      - name: Run E2E tests against localhost
        run: |
          npx astro preview --port 4321 &
          sleep 3
          BASE_URL=http://localhost:4321 npx playwright test
        env:
          CI: true

      - name: Upload Playwright report
        uses: actions/upload-artifact@v4
        if: ${{ !cancelled() }}
        with:
          name: playwright-report
          path: playwright-report/
          retention-days: 14

      - name: Deploy to Netlify
        if: github.event_name == 'push' && github.ref == 'refs/heads/master'
        uses: nwtgck/actions-netlify@v3
        with:
          publish-dir: ./dist
          production-deploy: true
        env:
          NETLIFY_AUTH_TOKEN: ${{ secrets.NETLIFY_AUTH_TOKEN }}
          NETLIFY_SITE_ID: ${{ secrets.NETLIFY_SITE_ID }}

      - name: Install k6
        if: github.event_name == 'push' && github.ref == 'refs/heads/master'
        run: |
          curl -fsSL https://github.com/grafana/k6/releases/download/v0.55.0/k6-v0.55.0-linux-amd64.tar.gz | tar xzf - --strip-components=1
          sudo mv k6 /usr/local/bin/

      - name: Wait for Netlify deployment to propagate
        if: github.event_name == 'push' && github.ref == 'refs/heads/master'
        run: sleep 15

      - name: Run k6 performance tests
        if: github.event_name == 'push' && github.ref == 'refs/heads/master'
        run: |
          mkdir -p tests/k6/results
          k6 run tests/k6/performance.js
        env:
          BASE_URL: https://paulyardleyqa.co.uk

      - name: Upload k6 results
        uses: actions/upload-artifact@v4
        if: github.event_name == 'push' && github.ref == 'refs/heads/master' && !cancelled()
        with:
          name: k6-performance-report
          path: tests/k6/results/
          retention-days: 30
